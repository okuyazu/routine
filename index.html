<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f17" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Benchmarks" />
  <title>My Benchmarks</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <button class="back" id="backBtn" aria-label="Back" hidden>‹</button>
    <div class="brand">
      <h1 id="appTitle">My Benchmarks</h1>
      <p id="appTagline">Personal milestones &amp; progress</p>
    </div>
    <button class="icon-btn" id="syncBtn" aria-label="Sync progress" title="Sync progress">⟳</button>
  </header>

  <main id="view" class="view"></main>

  <!-- Sync sheet -->
  <div class="sheet-backdrop" id="sheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-handle"></div>
      <h2 id="sheetTitle">Sync progress</h2>
      <p class="muted">Your checkmarks are saved on this device. To save them permanently
        (and share across devices), copy the snapshot below and paste it to Claude or ChatGPT,
        asking it to update the project files in your repo.</p>
      <textarea id="syncOut" readonly rows="8" spellcheck="false"></textarea>
      <div class="sheet-actions">
        <button class="btn primary" id="copyBtn">Copy snapshot</button>
        <button class="btn ghost" id="closeSheet">Close</button>
      </div>
      <p class="muted small" id="copyHint"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
